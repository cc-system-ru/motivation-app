{% extends "base.html" %}
{% block title %}Вход{% endblock %}
{% block body %}
<div style="max-width:380px;margin:8vh auto">
  <h1 style="text-align:center;margin-bottom:2px">Система мотивации</h1>
  <p class="sub" style="text-align:center">Введите пароль доступа</p>
  <div class="card">
    <form method="post">
      <label>Пароль</label>
      <input type="password" name="password" autofocus autocomplete="current-password" placeholder="••••••">
      <div style="margin-top:14px">
        <button class="btn" style="width:100%">Войти</button>
      </div>
    </form>
  </div>
  <p class="muted" style="text-align:center">
    Коммерческий департамент — KD20 · Операционный — OD20 · Администратор — admin
  </p>
</div>
{% endblock %}
